version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./inbox:/app/inbox
      - paydrive-data:/app/data
    env_file:
      - .env
    environment:
      - INBOX_PATH=/app/inbox
      - DATABASE_URL=sqlite+aiosqlite:///./data/paydrive.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  paydrive-data:
